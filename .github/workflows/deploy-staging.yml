name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-staging to confirm the deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Require main branch and explicit confirmation
        if: github.ref != 'refs/heads/main' || inputs.confirmation != 'deploy-staging'
        run: |
          echo "Deployments require the main branch and confirmation deploy-staging."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Validate required staging secrets
        shell: bash
        run: |
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            SUPABASE_PROJECT_REF \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required staging secret: $name"
              exit 1
            fi
          done

      - name: Link staging project
        run: >-
          npx supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: >-
          npx supabase db push
          --linked
          --password "$SUPABASE_DB_PASSWORD"
          --yes

      - name: Configure Edge Function secrets
        run: >-
          npx supabase secrets set
          --project-ref "$SUPABASE_PROJECT_REF"
          STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"

      - name: Deploy Edge Functions
        run: >-
          npx supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify deployed webhook route
        shell: bash
        run: |
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/stripe-webhook"
          status="$(curl --silent --show-error --output /tmp/youdo-webhook-response --write-out '%{http_code}' "$endpoint")"
          if [[ "$status" != "405" ]]; then
            echo "Expected webhook GET to return 405; received $status."
            sed -n '1,20p' /tmp/youdo-webhook-response
            exit 1
          fi
          echo "Staging webhook route is available."
